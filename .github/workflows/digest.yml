name: Digest

on:
  schedule:
    - cron: "0 1 * * 1,3,5"   # 6:30 AM IST. Starts early, the code waits until 9:30 AM sharp
  workflow_dispatch:           # manual run: sends immediately

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Write style examples
        run: printf '%s' "$EXAMPLES" > examples.txt
        env:
          EXAMPLES: ${{ secrets.EXAMPLES }}
      - name: Send digest
        run: uv run python runner.py ${{ github.event_name == 'schedule' && 'scheduled' || 'digest' }}
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          LINKEDIN_TOKEN_EXPIRES: ${{ secrets.LINKEDIN_TOKEN_EXPIRES }}
          LI_API_VERSION: ${{ secrets.LI_API_VERSION }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
